<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<style>

body{
font-family:Arial,sans-serif;
max-width:1000px;
margin:20px auto;
padding:20px;
}

h1{
text-align:center;
}

.card{
border:1px solid #ddd;
padding:15px;
margin-bottom:15px;
display:flex;
gap:20px;
align-items:center;
border-radius:10px;
}

.card img{
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
}

.qty-btn{
padding:6px 12px;
cursor:pointer;
font-size:18px;
}

.remove-btn{
background:red;
color:white;
border:none;
padding:8px 15px;
cursor:pointer;
border-radius:5px;
}

.pay-btn{
display:inline-block;
padding:12px 25px;
background:green;
color:white;
text-decoration:none;
border-radius:6px;
margin-top:15px;
}

.total{
font-size:26px;
font-weight:bold;
margin-top:20px;
}

</style>

</head>

<body>

<h1>🛒 Your Cart</h1>

<p>
<a href="index.html">← Continue Shopping</a>
</p>

<div id="cart-items"></div>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

const container =
document.getElementById("cart-items");

renderCart();

function renderCart(){

container.innerHTML = "";

let total = 0;

if(cart.length === 0){

container.innerHTML =
"<h2>Your cart is empty.</h2>";

return;

}

cart.forEach((product,index)=>{

let qty =
product.qty || 1;

let itemTotal =
product.price * qty;

total += itemTotal;

container.innerHTML += `

<div class="card">

<img src="${product.image}" alt="${product.name}">

<div>

<h3>${product.name}</h3>

<p>${product.category}</p>

<p>Price: ₹${product.price}</p>

<p>

<button
class="qty-btn"
onclick="decreaseQty(${index})">
-
</button>

<strong>${qty}</strong>

<button
class="qty-btn"
onclick="increaseQty(${index})">
+
</button>

</p>

<p>
Subtotal: ₹${itemTotal}
</p>

<button
class="remove-btn"
onclick="removeItem(${index})">
Remove
</button>

</div>

</div>

`;

});

let message =
"Hi Gifting Corner Co,%0A%0AI want to order:%0A";

cart.forEach(item=>{

message +=
`${item.name} x ${item.qty || 1} = ₹${item.price * (item.qty || 1)}%0A`;

});

message +=
`%0ATotal Amount: ₹${total}`;

container.innerHTML += `

<div class="total">

Total Amount: ₹${total}

<br><br>

<a
class="pay-btn"
href="upi://pay?pa=gowd2009@ybl&pn=Gifting%20Corner%20Co&am=${total}&cu=INR">

💳 Pay Now

</a>

<br><br>

<a
class="pay-btn"
target="_blank"
href="https://wa.me/919966927212?text=${message}">

📲 Order on WhatsApp

</a>

</div>

`;

}

function increaseQty(index){

cart[index].qty =
(cart[index].qty || 1) + 1;

saveCart();

}

function decreaseQty(index){

if((cart[index].qty || 1) > 1){

cart[index].qty--;

}else{

cart.splice(index,1);

}

saveCart();

}

function removeItem(index){

cart.splice(index,1);

saveCart();

}

function saveCart(){

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}

</script>

</body>
</html>
